<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">

          rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="twrapper">
    <h1>SongBattle</h1>
</div>
<div class="battle-arena">
    <div class="competitor-box">
        <h3 id="player-a-name" class="player-title">Song #1</h3>
        <div class="video-container">
            <iframe id="video-a" src="" allowfullscreen></iframe>
        </div>
        <button class="buttons win-btn" onclick="vote(1)">Winner</button>
    </div>

    <h1 class="vs-text">VS</h1>

    <div class="competitor-box">
        <h3 id="player-b-name" class="player-title">Song #2</h3>
        <div class="video-container">
            <iframe id="video-b" src="" allowfullscreen></iframe>
        </div>
        <button class="buttons win-btn" onclick="vote(2)">Winner</button>
    </div>
</div>
